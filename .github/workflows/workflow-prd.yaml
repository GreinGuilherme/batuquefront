name: batuque-web-pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Instalar e configurar o Flutter compatível com seu SDK (^3.13.3 / Flutter 3.41+)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 2. Baixar dependências e compilar o Flutter Web
      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release

      # 3. Configurar QEMU e Buildx para Multi-Arch (PC amd64 + Oracle OCI arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Login no Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 5. Build e Push da imagem Docker do Front
      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/batuque-web:latest
            ${{ secrets.DOCKER_USERNAME }}/batuque-web:${{ github.sha }}

      # 6. Deploy Automático na VPS Oracle OCI
      - name: Deploy to Oracle OCI VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 136.248.110.77
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd ~/batuqueapp
            mkdir -p ~/batuqueapp/web-content
            
            # Baixa a nova imagem do front
            docker compose pull batuque-web || docker pull ${{ secrets.DOCKER_USERNAME }}/batuque-web:latest
            
            # Opcional: Extrai os arquivos compilados direto para ~/batuqueapp/web-content
            # Assim o próprio container nginx-proxy pode servir os arquivos sem precisar de outro proxy!
            docker create --name temp-web ${{ secrets.DOCKER_USERNAME }}/batuque-web:latest
            rm -rf ~/batuqueapp/web-content/*
            docker cp temp-web:/usr/share/nginx/html/. ~/batuqueapp/web-content/
            docker rm temp-web
            
            # Atualiza os containers em execução
            docker compose up -d
            docker image prune -f